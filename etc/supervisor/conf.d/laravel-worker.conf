[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
; --timeout muss >= Job-Timeout sein (ProcessIngestRenderJob: 14400s für lange Ingest-FFmpeg-Läufe).
; PHP-Binary ggf. an Server anpassen (z. B. /usr/bin/php84 statt php).
command=php /usr/home/admin/public_html/media/laravel12/artisan queue:work --sleep=3 --tries=3 --timeout=14400
autostart=true
autorestart=true
user=admin
numprocs=1
redirect_stderr=true
stdout_logfile=/usr/home/admin/public_html/media/laravel12/storage/logs/worker.log
stopwaitsecs=3600
